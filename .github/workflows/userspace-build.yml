name: Build Pure Vega Linux 0.5.0 Userspace

on:
  workflow_dispatch:
    inputs:
      kernel_url:
        description: "Direct URL to pre-built Linux Kernel (Image)"
        required: true
        default: "https://files.catbox.moe/b1qhq4"

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison flex texinfo \
            parted dosfstools mtools e2fsprogs zstd \
            wget curl git libncurses-dev ncurses-bin pkg-config

      - name: Setup Musl AArch64 Cross-Toolchain
        run: |
          mkdir -p /opt/toolchain
          cd /opt/toolchain
          wget -q https://musl.cc/aarch64-linux-musl-cross.tgz
          tar -xzf aarch64-linux-musl-cross.tgz
          echo "/opt/toolchain/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Fetch Pre-Compiled Kernel Image
        run: |
          mkdir -p artifacts/kernel
          # Очистка URL от возможных опечаток (например, знак процента на конце)
          RAW_URL="${{ github.event.inputs.kernel_url }}"
          CLEAN_URL=$(echo "$RAW_URL" | sed 's/%$//')
          echo "Downloading kernel Image from: $CLEAN_URL"
          curl -L -f -o artifacts/kernel/Image "$CLEAN_URL"
          file artifacts/kernel/Image

      - name: Fetch Limine Bootloader (AArch64)
        run: |
          git clone https://github.com/limine-bootloader/limine.git --branch=v8.x-binary --depth=1 artifacts/limine
          ls -lh artifacts/limine/BOOTAA64.EFI

      - name: Compile Pure Upstream Userspace
        run: |
          set -e
          SRC="$(pwd)/src"
          ROOTFS="$(pwd)/rootfs"
          mkdir -p "$SRC" "$ROOTFS"

          export CC=aarch64-linux-musl-gcc
          export CXX=aarch64-linux-musl-g++
          export AR=aarch64-linux-musl-ar
          export RANLIB=aarch64-linux-musl-ranlib
          export CROSS_COMPILE=aarch64-linux-musl-

          # 1. Linux API Headers 6.6.78
          echo "==> Building Linux API Headers 6.6.78..."
          cd "$SRC"
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.78.tar.xz
          tar -xf linux-6.6.78.tar.xz
          cd linux-6.6.78
          make ARCH=arm64 headers_install INSTALL_HDR_PATH="$ROOTFS/usr"

          # 2. musl libc 1.2.5
          echo "==> Building musl libc 1.2.5..."
          cd "$SRC"
          wget -q https://musl.libc.org/releases/musl-1.2.5.tar.gz
          tar -xzf musl-1.2.5.tar.gz
          cd musl-1.2.5
          ./configure --prefix=/usr --syslibdir=/lib
          make -j$(nproc)
          make DESTDIR="$ROOTFS" install
          mkdir -p "$ROOTFS/lib"
          [ -e "$ROOTFS/lib/ld-musl-aarch64.so.1" ] || ln -sf /usr/lib/libc.so "$ROOTFS/lib/ld-musl-aarch64.so.1"

          # 3. BusyBox 1.36.1
          echo "==> Building BusyBox 1.36.1..."
          cd "$SRC"
          wget -q https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          tar -xjf busybox-1.36.1.tar.bz2
          cd busybox-1.36.1
          make defconfig
          sed -i 's/CONFIG_STATIC=y/CONFIG_STATIC=n/' .config
          make -j$(nproc)
          make CONFIG_PREFIX="$ROOTFS" install

          # 4. ncurses 6.5
          echo "==> Building ncurses 6.5..."
          cd "$SRC"
          wget -q https://ftp.gnu.org/gnu/ncurses/ncurses-6.5.tar.gz
          tar -xzf ncurses-6.5.tar.gz
          cd ncurses-6.5
          ./configure \
            --host=aarch64-linux-musl \
            --prefix=/usr \
            --with-shared \
            --without-debug \
            --enable-widec \
            --without-ada \
            --disable-stripping
          make -j$(nproc)
          make DESTDIR="$ROOTFS" install
          ln -sf libncursesw.so "$ROOTFS/usr/lib/libncurses.so" 2>/dev/null || true

          # 5. GNU Bash 5.2
          echo "==> Building GNU Bash 5.2..."
          cd "$SRC"
          wget -q https://ftp.gnu.org/gnu/bash/bash-5.2.tar.gz
          tar -xzf bash-5.2.tar.gz
          cd bash-5.2
          cat << 'CACHE_EOF' > config.cache
          bash_cv_job_control_missing=present
          bash_cv_sys_named_pipes=present
          bash_cv_func_sigsetjmp=present
          bash_cv_printf_a_format=yes
          bash_cv_unusable_rtsigs=no
          CACHE_EOF
          ./configure \
            --host=aarch64-linux-musl \
            --prefix=/usr \
            --without-bash-malloc \
            --with-curses \
            --cache-file=config.cache
          make -j$(nproc)
          make DESTDIR="$ROOTFS" install
          mkdir -p "$ROOTFS/bin"
          ln -sf /usr/bin/bash "$ROOTFS/bin/bash"
          ln -sf /usr/bin/bash "$ROOTFS/bin/sh"

          # 6. e2fsprogs 1.47.1 (resize2fs)
          echo "==> Building e2fsprogs 1.47.1..."
          cd "$SRC"
          wget -q https://kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v1.47.1/e2fsprogs-1.47.1.tar.gz
          tar -xzf e2fsprogs-1.47.1.tar.gz
          cd e2fsprogs-1.47.1
          ./configure \
            --host=aarch64-linux-musl \
            --prefix=/usr \
            --disable-nls \
            --disable-defrag \
            --disable-e2initrd-helper
          make -j$(nproc)
          make DESTDIR="$ROOTFS" install

          # 7. ble.sh 0.3.4
          echo "==> Installing ble.sh 0.3.4..."
          wget -q -O /tmp/blesh.tar.xz https://github.com/akinomyoga/ble.sh/releases/download/v0.3.4/ble-0.3.4.tar.xz
          mkdir -p "$ROOTFS/usr/share/blesh"
          tar -xf /tmp/blesh.tar.xz -C "$ROOTFS/usr/share/blesh" --strip-components=1

      - name: Configure Vega Linux 0.5.0 Identity and Boot Subsystem
        run: |
          ROOTFS="$(pwd)/rootfs"

          mkdir -p "$ROOTFS"/{etc/vega,usr/lib/vega,dev/pts,proc,sys,run,tmp,home,root,sbin}
          chmod 1777 "$ROOTFS/tmp"
          chmod 0700 "$ROOTFS/root"

          echo "0.5.0" > "$ROOTFS/etc/vega/version"
          echo "vega" > "$ROOTFS/etc/hostname"

          cat > "$ROOTFS/etc/hosts" << 'EOF'
          127.0.0.1   localhost
          127.0.1.1   vega
          ::1         localhost ip6-localhost ip6-loopback
          EOF

          cat > "$ROOTFS/etc/os-release" << 'EOF'
          NAME="Vega Linux"
          ID=vega
          VERSION="0.5.0"
          VERSION_ID=0.5.0
          PRETTY_NAME="Vega Linux 0.5.0 (AArch64)"
          ANSI_COLOR="1;36"
          HOME_URL="https://github.com/vega-linux"
          BUG_REPORT_URL="https://github.com/vega-linux/issues"
          EOF
          ln -sfn ../../etc/os-release "$ROOTFS/usr/lib/os-release"

          cat > "$ROOTFS/etc/issue" << 'EOF'

          \033[1;36mWelcome to Vega Linux 0.5.0!\033[0m
          Kernel \r on an \m (\l)

          EOF
          cp "$ROOTFS/etc/issue" "$ROOTFS/etc/issue.net"

          cat > "$ROOTFS/etc/motd" << 'EOF'

          \033[1;36mWelcome to Vega Linux 0.5.0!\033[0m
          Pure upstream-built independent AArch64 system.

          Type '\033[1;32mabout\033[0m' to learn more about Vega Linux.

          EOF

          cat > "$ROOTFS/etc/passwd" << 'EOF'
          root:x:0:0:root:/root:/bin/bash
          EOF

          cat > "$ROOTFS/etc/shadow" << 'EOF'
          root:!::0:99999:7:::
          EOF
          chmod 0640 "$ROOTFS/etc/shadow"

          cat > "$ROOTFS/etc/group" << 'EOF'
          root:x:0:
          wheel:x:10:root
          users:x:100:
          EOF

          chmod 4755 "$ROOTFS/bin/busybox"

          # Профиль Bash с ble.sh (бирюзовый UI и автодополнение по ->)
          cat > "$ROOTFS/etc/profile" << 'EOF'
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export TERM=xterm-256color
          export LANG=C.UTF-8
          export PAGER=less

          HISTSIZE=10000
          HISTFILESIZE=20000
          HISTCONTROL=ignoreboth
          shopt -s histappend 2>/dev/null
          PROMPT_COMMAND="history -a; $PROMPT_COMMAND"

          if [ "$(id -u)" -eq 0 ]; then
              PS1='\[\e[1;31m\]\u@vega\[\e[0m\]:\[\e[1;36m\]\w\[\e[0m\]# '
          else
              PS1='\[\e[1;32m\]\u\[\e[0m\]@\[\e[1;36m\]vega\[\e[0m\]:\[\e[1;36m\]\w\[\e[0m\]\$ '
          fi

          alias ls='ls --color=auto'
          alias ll='ls -lah'

          if [[ $- == *i* ]] && [ -f /usr/share/blesh/ble.sh ] && [[ ! -v BLE_VERSION ]]; then
              source /usr/share/blesh/ble.sh --noattach
              bleopt delay_syntax=50
              bleopt delay_auto_complete=50
              bleopt exec_exit_mark=""
              bleopt exec_elapsed_mark=""
              ble-bind -m auto_complete -f 'right' auto_complete/insert
              ble-bind -m auto_complete -f 'C-f'   auto_complete/insert
              ble-attach
          fi
          EOF
          cp "$ROOTFS/etc/profile" "$ROOTFS/root/.bashrc"

          # Манифест about
          cat > "$ROOTFS/usr/bin/about" << 'EOF'
          #!/bin/bash
          C="\033[1;36m"; G="\033[1;32m"; W="\033[1;37m"; Y="\033[1;33m"; R="\033[0m"
          clear
          echo -e "${C}================================================================${R}"
          echo -e "${C}                     VEGA LINUX 0.5.0 (AArch64)                 ${R}"
          echo -e "${C}================================================================${R}"
          echo
          echo -e "${W}Philosophy:${R}"
          echo -e "  Vega Linux is built directly from pure upstream sources."
          echo -e "  It is an independent, sovereign AArch64 operating system designed"
          echo -e "  for maximum lightness, transparency, and hardware efficiency."
          echo
          echo -e "${W}Architecture:${R}"
          echo -e "  ${G}* Base:${R}        musl libc 1.2.5 + GNU Bash 5.2 + BusyBox 1.36.1"
          echo -e "  ${G}* Tooling:${R}     e2fsprogs 1.47.1 + ble.sh 0.3.4"
          echo -e "  ${G}* Storage:${R}     Dynamic Sparse Storage with online ext4 auto-resizing"
          echo -e "  ${G}* Boot:${R}        UEFI AAVMF + Limine Bootloader Protocol"
          echo
          echo -e "${C}================================================================${R}"
          EOF
          chmod 0755 "$ROOTFS/usr/bin/about"

          # Firstboot Setup Wizard
          cat > "$ROOTFS/etc/vega/firstboot.sh" << 'EOF'
          #!/bin/bash
          clear
          echo -e "\033[1;36m========================================================\033[0m"
          echo -e "\033[1;36m             Welcome to Vega Linux 0.5.0!               \033[0m"
          echo -e "\033[1;33m                 Initial System Setup                   \033[0m"
          echo -e "\033[1;36m========================================================\033[0m"
          echo -e "Independent upstream AArch64 system initialization.\n"

          while true; do
              read -r -p "Enter username for primary administrator: " NEWUSER
              NEWUSER=$(echo "$NEWUSER" | tr '[:upper:]' '[:lower:]' | xargs)
              [[ "$NEWUSER" =~ ^[a-z_][a-z0-9_-]{1,31}$ ]] && break
              echo -e "\033[1;31mInvalid username format.\033[0m"
          done

          while true; do
              read -r -s -p "Enter password for $NEWUSER: " PASS1; echo
              [ ${#PASS1} -lt 4 ] && { echo -e "\033[1;31mMinimum 4 characters required.\033[0m"; continue; }
              read -r -s -p "Confirm password: " PASS2; echo
              [ "$PASS1" != "$PASS2" ] && { echo -e "\033[1;31mPasswords do not match.\033[0m"; continue; }
              break
          done

          echo -e "\n\033[1;36m==>\033[0m Creating account and configuring permissions..."
          adduser -D -s /bin/bash -G wheel "$NEWUSER"
          echo "$NEWUSER:$PASS1" | chpasswd
          echo "root:$PASS1" | chpasswd
          chmod 0700 "/home/$NEWUSER"
          cp /etc/profile "/home/$NEWUSER/.bashrc"
          chown -R "$NEWUSER:wheel" "/home/$NEWUSER"

          touch /etc/vega/.firstboot_done
          sync
          echo -e "\033[1;32m==> Setup complete!\033[0m Starting session...\n"
          sleep 1
          exec su - "$NEWUSER"
          EOF
          chmod 0755 "$ROOTFS/etc/vega/firstboot.sh"

          # Login manager
          cat > "$ROOTFS/etc/vega/login-manager.sh" << 'EOF'
          #!/bin/sh
          if [ ! -f /etc/vega/.firstboot_done ]; then
              exec /etc/vega/firstboot.sh
          fi
          exec /bin/login "$@"
          EOF
          chmod 0755 "$ROOTFS/etc/vega/login-manager.sh"

          # Inittab
          cat > "$ROOTFS/etc/inittab" << 'EOF'
          ::sysinit:/etc/vega/rc.sysinit
          ttyAMA0::respawn:/sbin/getty -L -n -l /etc/vega/login-manager.sh 115200 ttyAMA0 xterm-256color
          ::ctrlaltdel:/sbin/reboot
          ::shutdown:/etc/vega/rc.shutdown
          EOF

          # rc.sysinit
          cat > "$ROOTFS/etc/vega/rc.sysinit" << 'EOF'
          #!/bin/sh
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin

          mount -t proc proc /proc -o nosuid,nodev,noexec
          mount -t sysfs sysfs /sys -o nosuid,nodev,noexec
          mount -t devtmpfs devtmpfs /dev -o nosuid,mode=0755
          mkdir -p /dev/pts /dev/shm /run /tmp
          mount -t devpts devpts /dev/pts -o nosuid,noexec,gid=5,mode=0620,ptmxmode=0666
          mount -t tmpfs tmpfs /dev/shm -o nosuid,nodev,mode=1777
          mount -t tmpfs tmpfs /run -o nosuid,nodev,mode=0755
          mount -t tmpfs tmpfs /tmp -o nosuid,nodev,mode=1777

          ln -sfn /proc/self/fd /dev/fd
          ln -sfn fd/0 /dev/stdin
          ln -sfn fd/1 /dev/stdout
          ln -sfn fd/2 /dev/stderr
          [ -e /dev/ptmx ] || ln -s pts/ptmx /dev/ptmx

          dmesg -n 3 2>/dev/null
          hostname -F /etc/hostname 2>/dev/null || hostname vega

          # Онлайн-расширение ext4 на весь раздел
          if [ -b /dev/vda2 ]; then
              /usr/sbin/resize2fs /dev/vda2 >/dev/null 2>&1 || /sbin/resize2fs /dev/vda2 >/dev/null 2>&1 || true
          fi

          ip link set lo up
          ip link set eth0 up 2>/dev/null
          udhcpc -i eth0 -s /etc/vega/udhcpc.script -b -p /run/udhcpc.eth0.pid >/dev/null 2>&1
          echo -e "\033[1;36m[vega]\033[0m Boot sequence completed."
          EOF
          chmod 0755 "$ROOTFS/etc/vega/rc.sysinit"

          # udhcpc script
          cat > "$ROOTFS/etc/vega/udhcpc.script" << 'EOF'
          #!/bin/sh
          case "$1" in
              deconfig) ip -4 addr flush dev "$interface" 2>/dev/null ;;
              bound|renew)
                  ip addr replace "$ip/${mask:-24}" dev "$interface"
                  [ -n "$router" ] && ip route replace default via "$router" dev "$interface"
                  if [ -n "$dns" ]; then
                      echo -n > /etc/resolv.conf
                      for s in $dns; do echo "nameserver $s" >> /etc/resolv.conf; done
                  fi
                  ;;
          esac
          exit 0
          EOF
          chmod 0755 "$ROOTFS/etc/vega/udhcpc.script"

          # rc.shutdown
          cat > "$ROOTFS/etc/vega/rc.shutdown" << 'EOF'
          #!/bin/sh
          echo -e "\033[1;36m[vega]\033[0m Shutting down system..."
          kill -TERM -1 2>/dev/null; sleep 1
          kill -KILL -1 2>/dev/null
          sync
          mount -o remount,ro / 2>/dev/null
          EOF
          chmod 0755 "$ROOTFS/etc/vega/rc.shutdown"

      - name: Build GPT Sparse Image with Limine & Kernel
        run: |
          set -e
          OUT="$(pwd)/artifacts/image"
          mkdir -p "$OUT"

          # 1. Форматирование rootfs с базовыми совместимыми флагами
          mke2fs -t ext4 -b 4096 \
            -O ^metadata_csum,^metadata_csum_seed,^orphan_file,^large_dir,^64bit \
            -L "vega-root" \
            -d "$(pwd)/rootfs" \
            rootfs.img 600M

          # 2. ESP раздел (FAT32, 80M)
          dd if=/dev/zero of=esp.img bs=1M count=80 status=none
          mkfs.vfat -F 32 -n "EFI" esp.img
          mmd -i esp.img ::EFI ::EFI/BOOT ::limine

          cat > limine.conf << 'EOF'
          timeout: 3

          /Vega Linux 0.5.0
              protocol: linux
              kernel_path: boot():/vmlinux-vega
              cmdline: console=ttyAMA0 root=/dev/vda2 rootfstype=ext4 rootwait rw init=/sbin/init
          EOF

          mcopy -i esp.img artifacts/limine/BOOTAA64.EFI ::EFI/BOOT/BOOTAA64.EFI
          mcopy -i esp.img artifacts/kernel/Image ::vmlinux-vega
          mcopy -i esp.img limine.conf ::limine.conf
          mcopy -i esp.img limine.conf ::EFI/BOOT/limine.conf

          # 3. Формирование 10GB Sparse Image
          IMG="$OUT/vega-0.5.0-aarch64.img"
          truncate -s 10G "$IMG"

          parted -s "$IMG" \
            mklabel gpt \
            mkpart EFI fat32 2048s 165887s \
            set 1 esp on \
            mkpart RootFS ext4 165888s 100%

          dd if=esp.img of="$IMG" bs=512 seek=2048 conv=notrunc status=none
          dd if=rootfs.img of="$IMG" bs=512 seek=165888 conv=notrunc status=none

          # 4. Сжатие Zstandard
          cd "$OUT"
          zstd -19 --rm vega-0.5.0-aarch64.img -o vega-0.5.0-aarch64.img.zst
          sha256sum vega-0.5.0-aarch64.img.zst > vega-0.5.0-aarch64.img.zst.sha256
          ls -lh

      - name: Upload Vega Linux 0.5.0 Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vega-0.5.0-aarch64
          path: |
            artifacts/image/vega-0.5.0-aarch64.img.zst
            artifacts/image/vega-0.5.0-aarch64.img.zst.sha256
          retention-days: 7
